name: cloudcine
description: "CloudCine 云影 —— 网盘媒体库播放器（夸克网盘优先）"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理与路由
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # 网络
  dio: ^5.7.0

  # 本地索引库
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0

  # 安全存储（会话 Cookie）
  flutter_secure_storage: ^9.2.2

  # 视频播放：media_kit（mpv）。格式覆盖（MKV/AVI/TS/RMVB…）与字幕能力
  # （内嵌 ASS/SSA 渲染、外挂字幕）都远强于 video_player。
  # ⚠️ 一个桌面/移动平台一个原生库包，缺哪个哪个平台就没有 libmpv。
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_macos_video: ^1.1.4
  media_kit_libs_windows_video: ^1.0.10
  media_kit_libs_android_video: ^1.3.6

  # PC 端播放器独立窗口。
  #
  # ⚠️ 它给每个窗口开**独立的 Flutter 引擎**（官方原文：*Each window created by this
  # plugin has its own dedicated Flutter engine. Method channels cannot be shared
  # between engines.*）。后果是 mpv 的 `Player` 跨不了引擎 —— 播放引擎必须整体
  # 搬进播放器窗口。这是刻意的取舍，见 `lib/domain/services/player_host.dart`。
  #
  # 备选 `multiview_desktop`（单引擎多窗口，无需拆引擎）要求 Flutter ≥3.38.2，
  # 当前 3.29 装不上。
  #
  # ⚠️ 必须精确钉在 0.3.0，不能用 ^0.3.1：0.3.1 的 Windows 原生代码调了
  # `DartProject::set_ui_thread_policy(flutter::UIThreadPolicy::…)`，
  # 这个 API 只在更新的 Flutter 引擎头文件里存在 —— Flutter 3.29 下
  # `flutter build windows` 直接报 `C2039: 'set_ui_thread_policy' is not
  # a member of 'flutter::DartProject'`。0.3.0 与 0.3.1 的 Dart 层 API
  # 完全一致（`WindowController` / `WindowConfiguration` /
  # `WindowMethodChannel`），降级不影响任何 Dart 调用点。
  desktop_multi_window: 0.3.0

  # 浏览器授权（备选通道：登录后抓取 Cookie）
  flutter_inappwebview: ^6.1.5

  # 文件选择器：播放器里的「加载本地字幕文件」。
  #
  # ⚠️ 它需要 macOS 的 `com.apple.security.files.user-selected.read-only`
  # 权限（两份 entitlements 都已加）。没有那一条时，选择器**能**弹出、
  # **能**返回路径，但紧接着的读取会失败 —— 报的还不是权限错。
  #
  # 选官方 `file_selector` 而不是 `file_picker`：前者是 flutter/packages 下的
  # 官方实现，各平台的接口形状一致，也不需要额外的网络权限声明。
  file_selector: ^1.0.3

  # 工具
  crypto: ^3.0.6
  uuid: ^4.5.1
  collection: ^1.19.0
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  fast_gbk: ^1.0.0

  # 第二内核：fvp（libmdk）。**只用于杜比视界片源**，其余片源仍走 media_kit。
  #
  # 为什么要它：DV Profile 5 的像素在 IPT-PQ-C2 空间里，还原成 RGB 必须把 RPU
  # 元数据应用在**渲染阶段**。macOS 上 media_kit 走 mpv 的 render API
  # （`vo=libmpv`），而它的后端只有 `gpu`/`sw` 两个，`vo=gpu-next` **架构上
  # 不可达** —— libmpv 这条路在 macOS 上不可能渲染 DV。mdk 内置 Metal shader
  # 做 RPU reshape，已 PoC 验证颜色正确。
  #
  # ⚠️ fvp 是 `video_player` 的平台实现，**必须在启动时显式
  # `fvp.registerWith(options: {'platforms': ['macos']})`** —— 它的 macOS
  # 声明里没有 `dartPluginClass`，不注册就会静默走 Apple 那套栈，
  # 测出来是假阴性。
  fvp: ^0.39.0
  video_player: ^2.10.1

dependency_overrides:
  # ⛔ vendored Android 实现：默认 ExoPlayer 缓冲上限只有 2.5MB，4K 高码率
  # 下「播一会缓冲一会」、进度条看不到缓冲层。覆盖成 path 依赖，让
  # `packages/video_player_android` 里调大的缓冲配置生效。
  video_player_android:
    path: packages/video_player_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    # 播放器窗口的「自检视频」：32 KB，H.264 baseline + AAC，3 秒。
    # 用来把「mpv 在这个引擎里到底能不能出画」变成一个不受环境影响的
    # 确定性结论 —— 走 asset 而不是让用户选本地文件，是因为 macOS 沙箱下
    # 读用户选中的文件需要 `files.user-selected.read-only`，本应用没有申请。
    - assets/player_selftest.mp4

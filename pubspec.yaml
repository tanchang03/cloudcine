name: cloudcine
description: "CloudCine 云影 —— 网盘媒体库播放器（夸克网盘优先）"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 状态管理与路由
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2

  # 网络
  dio: ^5.7.0

  # 本地索引库
  drift: ^2.22.1
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.0

  # 安全存储（会话 Cookie）
  flutter_secure_storage: ^9.2.2

  # 视频播放：media_kit（mpv）。格式覆盖（MKV/AVI/TS/RMVB…）与字幕能力
  # （内嵌 ASS/SSA 渲染、外挂字幕）都远强于 video_player。
  # ⚠️ 一个桌面/移动平台一个原生库包，缺哪个哪个平台就没有 libmpv。
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_macos_video: ^1.1.4
  media_kit_libs_windows_video: ^1.0.10
  media_kit_libs_android_video: ^1.3.6

  # 浏览器授权（备选通道：登录后抓取 Cookie）
  flutter_inappwebview: ^6.1.5

  # 工具
  crypto: ^3.0.6
  uuid: ^4.5.1
  collection: ^1.19.0
  url_launcher: ^6.3.1
  qr_flutter: ^4.1.0
  fast_gbk: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.22.1
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
